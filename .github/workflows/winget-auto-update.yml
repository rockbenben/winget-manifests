name: winget manifest auto-update

on:
  schedule:
    # every six hours, off the hour so it does not pile onto the top-of-hour runners
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'Only check this package identifier, for example rockbenben.Clockwork. Leave empty to check all.'
        required: false
        type: string
  repository_dispatch:
    types: [app-released]

permissions:
  contents: read

concurrency:
  group: winget-manifest-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Detect new app releases and open winget pull requests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_FILTER: ${{ github.event.inputs.app }}
      APP_FILTER_DISPATCH: ${{ github.event.client_payload.app_id }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect new app releases
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = $env:APP_FILTER
          if (-not $filter) { $filter = $env:APP_FILTER_DISPATCH }
          ./scripts/update-apps-json.ps1 -Filter $filter
          $pending = Get-Content -LiteralPath './pending.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($pending).Count -eq 0) {
            'hasUpdates=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'hasUpdates=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Check that the submit token is available
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error 'WINGET_TOKEN is not set. Add a GitHub personal access token (classic) with the public_repo scope as a repository secret named WINGET_TOKEN.'
            exit 1
          }

      - name: Regenerate the manifests
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: ./scripts/generate-manifests.ps1

      - name: Validate the regenerated manifests
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pending = Get-Content -LiteralPath './pending.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $hasWinget = [bool](Get-Command winget -ErrorAction SilentlyContinue)
          $failed = @()
          foreach ($p in $pending) {
            $dir = Join-Path 'manifests/r/rockbenben' (Join-Path $p.folder $p.version)
            Write-Host "validating $dir"
            if ($hasWinget) {
              winget validate --manifest $dir --disable-interactivity
              if ($LASTEXITCODE -ne 0) { $failed += $p.id }
            } else {
              Write-Host 'winget is not available on this runner, skipping the local schema check'
            }
          }
          if ($failed.Count -gt 0) { throw "winget validate failed for: $($failed -join ', ')" }

      - name: Commit the regenerated manifests
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json manifests pending.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore: refresh winget manifests for new app releases'
            git push origin HEAD:refs/heads/main
          } else {
            Write-Host 'nothing changed, nothing to commit'
          }

      - name: Open the pull requests against winget-pkgs
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: ./scripts/submit-manifest-pr.ps1
