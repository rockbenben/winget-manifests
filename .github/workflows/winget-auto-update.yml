name: winget manifest auto-update

on:
  schedule:
    # every six hours, off the hour so it does not pile onto the top-of-hour runners
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'Only check this package identifier, for example rockbenben.Clockwork. Leave empty to check all.'
        required: false
        type: string
  repository_dispatch:
    types: [app-released]

permissions:
  contents: read

concurrency:
  group: winget-manifest-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Detect new app releases and open winget pull requests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_FILTER: ${{ github.event.inputs.app }}
      APP_FILTER_DISPATCH: ${{ github.event.client_payload.app_id }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect new app releases
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = $env:APP_FILTER
          if (-not $filter) { $filter = $env:APP_FILTER_DISPATCH }
          ./scripts/update-apps-json.ps1 -Filter $filter
          $pending = Get-Content -LiteralPath './pending.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($pending).Count -eq 0) {
            'hasUpdates=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'hasUpdates=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Check that the submit token works
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_TOKEN) {
            Write-Error 'WINGET_TOKEN is not set. Add a GitHub personal access token (classic) with the public_repo scope as a repository secret named WINGET_TOKEN.'
            exit 1
          }
          # The token is only used when there is something to publish, so a bad token would
          # otherwise stay invisible until the next release. Prove it works on every run
          # instead, and say exactly what is wrong when it does not.
          $env:GH_TOKEN = $env:WINGET_TOKEN
          $login = gh api user --jq .login
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINGET_TOKEN did not authenticate with GitHub. It is most likely expired or was copied with stray whitespace.'
            exit 1
          }
          Write-Host "submit token authenticates as $login"
          $push = gh api repos/rockbenben/winget-pkgs --jq '.permissions.push'
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINGET_TOKEN could not read rockbenben/winget-pkgs.'
            exit 1
          }
          if ($push -ne 'true') {
            Write-Error "WINGET_TOKEN has no push access to rockbenben/winget-pkgs (permissions.push=$push). A classic token needs the public_repo scope."
            exit 1
          }
          Write-Host 'submit token can push to rockbenben/winget-pkgs'

      - name: Regenerate the manifests
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: ./scripts/generate-manifests.ps1

      - name: Validate the regenerated manifests
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pending = Get-Content -LiteralPath './pending.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $hasWinget = [bool](Get-Command winget -ErrorAction SilentlyContinue)
          $failed = @()
          foreach ($p in $pending) {
            $dir = Join-Path 'manifests/r/rockbenben' (Join-Path $p.folder $p.version)
            Write-Host "validating $dir"
            if (-not $hasWinget) {
              Write-Host 'winget is not available on this runner, skipping the local schema check'
              continue
            }
            # winget reports warnings on stderr and some runner builds also exit non-zero for a
            # warning alone. Redirecting stderr into the pipeline under Stop turns those
            # warnings into a terminating error, so relax the preference for the call and
            # judge the result by what winget said.
            $ErrorActionPreference = 'Continue'
            $out = & winget validate --manifest $dir --disable-interactivity 2>&1 | Out-String
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $global:LASTEXITCODE = 0
            Write-Host $out
            Write-Host "winget exit code: $code"
            # The schema header used here is byte for byte the one Microsoft publishes in its
            # own merged manifests, so a warning about it is noise from an older winget
            # rather than a defect in the manifest.
            $succeeded = $out -match 'validation succeeded' -or $out -match '验证成功'
            if (-not $succeeded) { $failed += $p.id }
          }
          if ($failed.Count -gt 0) { throw "winget validate failed for: $($failed -join ', ')" }
          # The runner's pwsh shell turns the script's exit code into the step's exit code and
          # a native command that failed leaves LASTEXITCODE behind, so state the result
          # explicitly instead of letting that value decide.
          exit 0

      - name: Commit the regenerated manifests
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json manifests pending.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore: refresh winget manifests for new app releases'
            git push origin HEAD:refs/heads/main
          } else {
            Write-Host 'nothing changed, nothing to commit'
          }

      - name: Open the pull requests against winget-pkgs
        if: steps.detect.outputs.hasUpdates == 'true'
        shell: pwsh
        run: ./scripts/submit-manifest-pr.ps1
